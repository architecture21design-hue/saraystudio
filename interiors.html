<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interiors | Saray Studio</title>
<meta name="description" content="Interior design projects by Saray Studio." />
<style>
  :root {
    --ink: #1c1c1c;
    --ink-soft: #8a8a8a;
    --bg: #fdfdfb;
    --edge: 40px;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- top-left: name + menu ---------- */
  .brand-col { position: fixed; top: 34px; left: var(--edge); z-index: 20; }
  .brand { display: block; font-size: 22px; letter-spacing: 0.01em; }
  .menu { list-style: none; margin-top: 18px; padding-left: 22px; }
  .menu li { font-size: 14px; line-height: 1.85; letter-spacing: 0.02em; }
  .menu a { color: var(--ink-soft); transition: color .2s; }
  .menu a:hover, .menu a.active { color: var(--ink); }
  .burger { display: none; position: fixed; top: 26px; right: 20px; z-index: 30; padding: 8px; }
  .burger span { display: block; width: 22px; height: 1.5px; background: var(--ink); margin: 5px 0; transition: transform .3s, opacity .3s; }
  body.menu-open .burger span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  body.menu-open .burger span:nth-child(2) { opacity: 0; }
  body.menu-open .burger span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  /* ---------- bottom-left: profile / contact / instagram in one line ---------- */
  .links { position: fixed; left: var(--edge); bottom: 34px; z-index: 20; display: flex; gap: 26px; }
  .links a { font-size: 13px; letter-spacing: 0.04em; color: var(--ink-soft); transition: color .2s; }
  .links a:hover { color: var(--ink); }

  /* ---------- center: one project per screen, vertical scroll ---------- */
  .projects { position: fixed; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  .projects::-webkit-scrollbar { display: none; }
  .project { height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; width: min(46vw, 820px); height: 64%; display: flex; align-items: center; justify-content: center; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; transition: opacity .35s ease; }
  .stage img.fading { opacity: 0; }
  .hit { position: absolute; top: 0; bottom: 0; width: 50%; }
  .hit.prev { left: 0; cursor: w-resize; }
  .hit.next { right: 0; cursor: e-resize; }
  .tag { position: absolute; top: -26px; left: 0; font-size: 12px; font-style: italic; color: var(--ink-soft); }

  /* ---------- bottom-right: project info ---------- */
  .info { position: fixed; right: var(--edge); bottom: 34px; z-index: 20; width: 220px; font-size: 14px; line-height: 1.45; }
  .info .name { font-size: 17px; }
  .info .year { margin-top: 12px; }
  .info .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
  .info .count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .info button { font-size: 13px; color: var(--ink-soft); padding: 0; transition: color .2s; }
  .info button:hover { color: var(--ink); }

  /* ---------- view all: grid of every image in the project ---------- */
  .all { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding: 96px var(--edge) 80px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  body.all-open .all { opacity: 1; pointer-events: auto; }
  .all-head { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; padding: 34px var(--edge) 20px; background: var(--bg); font-size: 14px; }
  .all-head .name { font-size: 17px; }
  .all-head button { font-size: 13px; color: var(--ink-soft); }
  .all-head button:hover { color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .grid button { padding: 0; aspect-ratio: 4 / 3; overflow: hidden; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
  .grid button:hover img { opacity: .75; }

  /* ---------- phone ---------- */
  @media (max-width: 760px) {
    :root { --edge: 20px; }
    .brand-col { top: 26px; }
    .brand { font-size: 19px; }
    .menu { display: none; }
    .burger { display: block; }
    body.menu-open .menu { display: block; position: fixed; inset: 0; background: var(--bg); padding: 96px var(--edge) 0; margin: 0; z-index: -1; }
    body.menu-open .menu li { font-size: 22px; line-height: 1.7; }
    .stage { width: calc(100vw - 2 * var(--edge)); height: 52%; }
    .info { width: auto; left: var(--edge); bottom: 64px; }
    .info .name { font-size: 16px; }
    .links { bottom: 24px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  }
</style>
</head>
<body>

<div class="brand-col">
  <a class="brand" href="index.html">Saray Studio</a>
  <ul class="menu">
    <li><a href="interiors.html" class="active">Interiors</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="architecture.html">Architecture</a></li>
  </ul>
</div>
<button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>

<main class="projects" id="projects"></main>

<div class="info" id="info" aria-live="polite">
  <div class="name"></div>
  <div class="place"></div>
  <div class="year"></div>
  <div class="row"><button type="button" id="viewAll">View all</button><span class="count"></span></div>
</div>

<nav class="links">
  <a href="profile.html">Profile</a>
  <a href="contacts.html">Contact</a>
  <a href="https://www.instagram.com/mohsen_masoodnia/" target="_blank" rel="noopener">Instagram</a>
</nav>

<div class="all" id="all" aria-hidden="true">
  <div class="all-head"><span class="name"></span><button type="button" id="closeAll">Close</button></div>
  <div class="grid" id="grid"></div>
</div>

<script>
  var PROJECTS = [
    { name: 'Pool House',      place: 'Monferrato, Italy', year: '2024', dir: 'pool-house',      n: 12 },
    { name: 'Villa Monastero', place: 'Monferrato, Italy', year: '2024', dir: 'villa-monastero', n: 14 },
    { name: 'Settembrini 9',   place: 'Milano, Italy',     year: '2025', dir: 'settembrini',     n: 16, note: 'In progress', credit: 'With CIVICO 64' },
    { name: 'Scogliera 84',    place: 'Liguria, Italy',    year: '2025', dir: 'scogliera',       n: 5,  note: 'In progress' },
    { name: 'Torre 23',        place: 'Milano, Italy',     year: '2023', dir: 'torre-23',        n: 6 },
    { name: 'Casa Monastero',  place: 'Monferrato, Italy', year: '2024', dir: 'casa-monastero',  n: 3 }
  ];
  function src(p, i) { return 'images/projects/' + p.dir + '/' + String(i + 1).padStart(2, '0') + '.jpg'; }

  var main = document.getElementById('projects');
  var info = document.getElementById('info');
  var current = 0;

  // one screen per project
  PROJECTS.forEach(function (p, k) {
    p.idx = 0;
    var sec = document.createElement('section');
    sec.className = 'project';
    sec.dataset.k = k;
    sec.innerHTML =
      '<div class="stage">' +
        (p.note ? '<span class="tag">' + p.note + '</span>' : '') +
        '<img alt="' + p.name + ', ' + p.place + '" src="' + src(p, 0) + '"' + (k > 1 ? ' loading="lazy"' : '') + '>' +
        '<button class="hit prev" aria-label="Previous image"></button>' +
        '<button class="hit next" aria-label="Next image"></button>' +
      '</div>';
    main.appendChild(sec);
    sec.querySelector('.prev').onclick = function () { step(k, -1); };
    sec.querySelector('.next').onclick = function () { step(k, 1); };
  });

  function show(k, i) {
    var p = PROJECTS[k];
    p.idx = (i + p.n) % p.n;
    var img = main.children[k].querySelector('img');
    img.classList.add('fading');
    setTimeout(function () {
      img.src = src(p, p.idx);
      img.onload = function () { img.classList.remove('fading'); };
    }, 180);
    // warm the next one so arrows feel instant
    new Image().src = src(p, (p.idx + 1) % p.n);
    if (k === current) paintInfo();
  }
  function step(k, d) { show(k, PROJECTS[k].idx + d); }

  function paintInfo() {
    var p = PROJECTS[current];
    info.querySelector('.name').textContent = p.name;
    info.querySelector('.place').textContent = p.credit ? p.place + ' · ' + p.credit : p.place;
    info.querySelector('.year').textContent = p.year;
    info.querySelector('.count').textContent = (p.idx + 1) + ' / ' + p.n;
  }

  // the info block follows whichever project is on screen
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting && e.intersectionRatio > 0.55) { current = +e.target.dataset.k; paintInfo(); }
    });
  }, { root: main, threshold: [0.55] });
  Array.prototype.forEach.call(main.children, function (s) { io.observe(s); });
  paintInfo();

  // view all
  var all = document.getElementById('all');
  var grid = document.getElementById('grid');
  function openAll() {
    var p = PROJECTS[current];
    all.querySelector('.name').textContent = p.name;
    grid.innerHTML = '';
    for (var i = 0; i < p.n; i++) {
      (function (i) {
        var b = document.createElement('button');
        b.setAttribute('aria-label', p.name + ' image ' + (i + 1));
        b.innerHTML = '<img loading="lazy" alt="" src="' + src(p, i) + '">';
        b.onclick = function () { show(current, i); closeAll(); };
        grid.appendChild(b);
      })(i);
    }
    all.scrollTop = 0;
    document.body.classList.add('all-open');
    all.setAttribute('aria-hidden', 'false');
  }
  function closeAll() {
    document.body.classList.remove('all-open');
    all.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('viewAll').onclick = openAll;
  document.getElementById('closeAll').onclick = closeAll;

  // keyboard: left/right = images, esc = close
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeAll(); document.body.classList.remove('menu-open'); }
    if (document.body.classList.contains('all-open')) return;
    if (e.key === 'ArrowRight') step(current, 1);
    if (e.key === 'ArrowLeft') step(current, -1);
  });

  // phone menu
  document.querySelector('.burger').onclick = function () { document.body.classList.toggle('menu-open'); };
</script>
</body>
</html>
