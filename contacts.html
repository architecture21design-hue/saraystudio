<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Saray Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #c8c8c8;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/hero-bg.webp');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 24px;
      z-index: 10;
    }

    nav a, nav span {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #111;
      text-decoration: none;
    }

    nav a:hover { opacity: 0.55; }
    .nav-locked { pointer-events: none; cursor: default; }

    .contact-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      color: #111;
    }

    .contact-info p,
    .contact-info a {
      display: block;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 2;
      color: #111;
      text-decoration: none;
    }

    .contact-info a:hover { opacity: 0.55; }

    .contact-links {
      margin-top: 16px;
      display: flex;
      gap: 28px;
      justify-content: center;
    }

    .contact-links a {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
      text-decoration: none;
    }

    .contact-links a:hover { opacity: 0.55; }

    .bottom-bar {
      position: absolute;
      bottom: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 11;
    }

    .radio-label {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
    }

    .play-btn {
      width: 26px;
      height: 26px;
      border: 1.5px solid #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .play-btn svg {
      width: 8px;
      height: 8px;
      fill: #111;
      margin-left: 2px;
    }
  </style>
</head>
<body>
<div class="hero">
  <div class="hero-bg"></div>

  <nav>
    <span class="nav-locked">Projects</span>
    <span class="nav-locked">Studio</span>
    <a href="contacts.html">Contact</a>
  </nav>

  <div class="contact-info">
    <p>Via Marcona 16, 20129 Milan, Italy</p>
    <a href="mailto:STUDIOMASOUDNIA@GMAIL.COM">STUDIOMASOUDNIA@GMAIL.COM</a>
    <a href="tel:+393429546657">+39 3429546657</a>
    <div class="contact-links">
      <a href="https://www.instagram.com/mohsen_masoodnia/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://wa.me/393429546657" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>

  <div class="bottom-bar">
    <span class="radio-label">Radiosaray</span>
    <button class="play-btn" aria-label="Play">
      <svg viewBox="0 0 10 10"><polygon points="1,0 10,5 1,10"/></svg>
    </button>
  </div>
</div>
</body>
</html>
