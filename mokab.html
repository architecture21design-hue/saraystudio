<main class="project-page" data-screen-label="Mokab">

  </div>
</main>
<script src="site.js"></script>
<div id="tweaks-root"></div>
<script type="text/babel">
(function() {
  const STORAGE_KEY = 'gallery-view-mokab';
  const PG_DEFAULTS = /*EDITMODE-BEGIN*/{ "layout": "Stack" }/*EDITMODE-END*/;
  const stored = localStorage.getItem(STORAGE_KEY);
  const initDefaults = stored ? { ...PG_DEFAULTS, layout: stored } : PG_DEFAULTS;

  function GalleryPanel() {
    const [t, setTweak] = useTweaks(initDefaults);
    React.useEffect(() => {
      localStorage.setItem(STORAGE_KEY, t.layout);
      const g = document.querySelector('.project-gallery');
      if (!g) return;
      g.classList.toggle('view-grid',      t.layout === 'Grid');
      g.classList.toggle('view-masonry',   t.layout === 'Masonry');
      g.classList.toggle('view-justified', t.layout === 'Justify');
    }, [t.layout]);
    return (
      <TweaksPanel>
        <TweakSection label="Gallery" />
        <TweakSelect label="Layout" value={t.layout} options={['Stack','Grid','Masonry','Justify']} onChange={(v)=>setTweak('layout',v)} />
      </TweaksPanel>
    );
  }
  ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<GalleryPanel />);
})();
</script>
</body>
</html>
