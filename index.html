<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saray Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #c8c8c8;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/hero-bg.webp');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 24px;
      z-index: 10;
    }

    nav a, nav span {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #111;
      text-decoration: none;
    }

    nav a:hover { opacity: 0.55; }
    .nav-locked { pointer-events: none; cursor: default; }

    .hero-title {
      position: absolute;
      bottom: 44px;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 0 6px;
    }

    .hero-title img {
      width: 100%;
      display: block;
      mix-blend-mode: multiply;
    }

    .bottom-bar {
      position: absolute;
      bottom: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 11;
    }

    .radio-label {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
    }

    .hero-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      color: #111;
      width: 100%;
      padding: 0 32px;
    }

    .hero-message p {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.7;
      margin: 0;
    }

    #contactOverlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #contactOverlay.open { display: flex; }
    #contactOverlay .contact-info { pointer-events: auto; }

    .contact-info {
      text-align: center;
      padding: 0 32px;
      width: 100%;
    }

    .contact-info p,
    .contact-info a {
      display: block;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 2;
      color: #111;
      text-decoration: none;
    }

    .contact-info a:hover { opacity: 0.55; }

    .contact-links {
      margin-top: 16px;
      display: flex;
      gap: 28px;
      justify-content: center;
    }

    .contact-links a {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
      text-decoration: none;
    }

    .contact-links a:hover { opacity: 0.55; }

    .play-btn {
      width: 26px;
      height: 26px;
      border: 1.5px solid #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .play-btn svg {
      width: 8px;
      height: 8px;
      fill: #111;
      margin-left: 2px;
    }

    @media (max-width: 600px) {
      nav {
        padding: 14px 16px;
      }

      nav a, nav span {
        font-size: 10px;
        letter-spacing: 0.10em;
      }

      .hero-message {
        padding: 0 24px;
      }

      .hero-message p {
        font-size: 12px;
      }

      .hero-title {
        bottom: 70px;
        padding: 0;
      }

      .hero-title img {
        width: 62%;
        margin: 0 auto;
      }

      .contact-info {
        padding: 0 24px;
      }

      .contact-info p,
      .contact-info a {
        font-size: 12px;
        line-height: 1.8;
      }

      .contact-links {
        gap: 20px;
        margin-top: 12px;
      }

      .bottom-bar {
        left: 16px;
        right: 16px;
        bottom: calc(14px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
<div class="hero">
  <div class="hero-bg"></div>

  <nav>
    <span class="nav-locked">Projects</span>
    <a href="#" id="studioBtn">Studio</a>
    <a href="#" id="contactBtn">Contact</a>
  </nav>

  <div id="contactOverlay">
    <div class="contact-info">
      <p>Via Marcona 16, 20129 Milan, Italy</p>
      <a href="mailto:Info@saraystudio.it">Info@saraystudio.it</a>
    </div>
  </div>

  <div class="hero-message">
    <p>This website is under construction.</p>
    <p>we invite you to enjoy Radio Saray by clicking the player in the bottom-right corner.</p>
  </div>

  <div class="hero-title">
    <img src="images/logo.png" alt="Saray Studio" />
  </div>

  <div class="bottom-bar">
    <span class="radio-label">Radiosaray</span>
    <button class="play-btn" id="playBtn" aria-label="Play">
      <svg id="iconPlay" viewBox="0 0 10 10"><polygon points="1,0 10,5 1,10"/></svg>
      <svg id="iconPause" viewBox="0 0 10 10" style="display:none"><rect x="1" y="0" width="3" height="10"/><rect x="6" y="0" width="3" height="10"/></svg>
    </button>
  </div>
</div>

<audio id="player"></audio>

<script>
  const tracks = [
    'music/galate-oui.mp3',
    'music/isaak.mp3',
    'music/beautiful-friendship.mp3',
    'music/line-up.mp3',
    'music/joss-moog-wil.mp3'
  ];
  let current = 0;
  const audio = document.getElementById('player');
  const btn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');

  function loadAndPlay(index) {
    audio.src = tracks[index];
    audio.play();
  }

  audio.addEventListener('ended', () => {
    current = (current + 1) % tracks.length;
    loadAndPlay(current);
  });

  btn.addEventListener('click', () => {
    if (audio.paused) {
      if (!audio.src || audio.ended) loadAndPlay(current);
      else audio.play();
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    } else {
      audio.pause();
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    }
  });

  const overlay = document.getElementById('contactOverlay');
  const contactBtn = document.getElementById('contactBtn');
  const heroMessage = document.querySelector('.hero-message');

  contactBtn.addEventListener('click', (e) => {
    e.preventDefault();
    overlay.classList.toggle('open');
    heroMessage.style.display = overlay.classList.contains('open') ? 'none' : '';
  });

  document.getElementById('studioBtn').addEventListener('click', (e) => {
    e.preventDefault();
    overlay.classList.remove('open');
    heroMessage.style.display = '';
  });

  audio.addEventListener('play', () => {
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
  });
  audio.addEventListener('pause', () => {
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
  });
</script>
</body>
</html>
