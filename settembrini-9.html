<div id="tweaks-root"></div>
<script type="text/babel">
(function() {
  const STORAGE_KEY = 'mo-proj-settembrini';
  const initLayout = localStorage.getItem(STORAGE_KEY) || 'Masonry';

  function applyLayout(layout) {
    const g = document.querySelector('.project-gallery');
    if (!g) return;
    g.classList.toggle('view-grid',      layout === 'Grid');
    g.classList.toggle('view-masonry',   layout === 'Masonry');
    g.classList.toggle('view-justified', layout === 'Justify');
  }

  function GalleryPanel() {
    const [layout, setLayout] = React.useState(initLayout);
    React.useEffect(() => { applyLayout(layout); }, [layout]);
    const onChange = (v) => { setLayout(v); localStorage.setItem(STORAGE_KEY, v); };
    return (
      <TweaksPanel>
        <TweakSection label="Gallery" />
        <TweakSelect label="Layout" value={layout} options={['Stack','Grid','Masonry','Justify']} onChange={onChange} />
      </TweaksPanel>
    );
  }
  ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<GalleryPanel />);
})();
</script>
