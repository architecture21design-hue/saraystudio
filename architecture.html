<div id="tweaks-root"></div>
<script type="text/babel">
const ARCH_DEFAULTS = /*EDITMODE-BEGIN*/{ "layout": "Stack", "captions": true }/*EDITMODE-END*/;
function ArchPanel() {
  const [t, setTweak] = useTweaks(ARCH_DEFAULTS);
  React.useEffect(() => {
    const s = document.querySelector('.stack.architecture');
    if (!s) return;
    s.classList.toggle('view-grid',      t.layout === 'Grid');
    s.classList.toggle('view-masonry',   t.layout === 'Masonry');
    s.classList.toggle('view-justified', t.layout === 'Justify');
    s.classList.toggle('hide-captions',  !t.captions);
  }, [t.layout, t.captions]);
  return (
    <TweaksPanel>
      <TweakSection label="Gallery" />
      <TweakSelect label="Layout" value={t.layout} options={['Stack','Grid','Masonry','Justify']} onChange={(v)=>setTweak('layout',v)} />
      <TweakToggle label="Captions" value={t.captions} onChange={(v)=>setTweak('captions',v)} />
    </TweaksPanel>
  );
}
ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<ArchPanel />);
</script>
